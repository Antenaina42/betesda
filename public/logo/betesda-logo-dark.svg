<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 80" width="380" height="80">
  <defs>
    <linearGradient id="betesdaBlueDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <linearGradient id="betesdaTealDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2DD4BF" />
      <stop offset="100%" stop-color="#14B8A6" />
    </linearGradient>
  </defs>

  <!-- Medical Emblem -->
  <g transform="translate(10, 10)">
    <rect x="0" y="0" width="60" height="60" rx="16" fill="#0F172A" stroke="#1E293B" stroke-width="1.5" />
    
    <!-- Medical Cross -->
    <rect x="25" y="13" width="10" height="34" rx="4" fill="url(#betesdaBlueDark)" />
    <rect x="13" y="25" width="34" height="10" rx="4" fill="url(#betesdaBlueDark)" />
    
    <!-- Bethesda Wave / Healing Leaf Overlay -->
    <path d="M 12 37 C 22 43, 30 23, 48 23 C 44 33, 35 44, 23 41 Z" 
          fill="url(#betesdaTealDark)" 
          opacity="0.95" />
          
    <circle cx="30" cy="30" r="3.2" fill="#FFFFFF" />
  </g>

  <!-- Typography -->
  <g transform="translate(84, 18)">
    <text x="1" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="11" fill="#38BDF8" letter-spacing="3.5">
      CLINIQUE
    </text>
    
    <text x="0" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-weight="900" font-size="25" letter-spacing="1">
      <tspan fill="#FFFFFF">BETES</tspan><tspan fill="#38BDF8">DA</tspan>
    </text>
    <circle cx="160" cy="30" r="3.5" fill="#2DD4BF" />

    <text x="1" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-weight="500" font-size="10" fill="#94A3B8" letter-spacing="0.3">
      Soins, Bienveillance &amp; Gestion Intelligente
    </text>
  </g>
</svg>
