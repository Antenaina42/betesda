<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="iconBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#0F766E" />
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2DD4BF" />
      <stop offset="100%" stop-color="#14B8A6" />
    </linearGradient>
    <filter id="iconShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0284C7" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background squircle -->
  <rect x="6" y="6" width="88" height="88" rx="24" fill="url(#iconBg)" filter="url(#iconShadow)" />

  <!-- White Medical Cross -->
  <rect x="42" y="20" width="16" height="60" rx="6" fill="#FFFFFF" opacity="0.95"/>
  <rect x="20" y="42" width="60" height="16" rx="6" fill="#FFFFFF" opacity="0.95"/>

  <!-- Bethesda Flow / Wave / Healing Leaf -->
  <path d="M 20 60 C 35 70, 52 38, 78 36 C 72 52, 56 68, 38 65 Z" 
        fill="url(#leafGrad)" 
        opacity="0.95" />

  <!-- Center pulse node -->
  <circle cx="50" cy="50" r="4.5" fill="#FFFFFF" />
</svg>
